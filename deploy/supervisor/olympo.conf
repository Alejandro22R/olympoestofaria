; Supervisor: colas (Horizon) y tiempo real (Reverb). Copiar a /etc/supervisor/conf.d/olympo.conf
; y ejecutar: supervisorctl reread && supervisorctl update

[program:olympo-horizon]
process_name=%(program_name)s
command=php /var/www/olympo/current/artisan horizon
user=www-data
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/olympo/shared/storage/logs/horizon.log

[program:olympo-reverb]
process_name=%(program_name)s
command=php /var/www/olympo/current/artisan reverb:start --host=127.0.0.1 --port=8080
user=www-data
autostart=true
autorestart=true
stopwaitsecs=30
minfds=10000
redirect_stderr=true
stdout_logfile=/var/www/olympo/shared/storage/logs/reverb.log
