# Nginx para Olympo (Ubuntu 24.04 + PHP 8.3-FPM). Copiar a /etc/nginx/sites-available/olympo
# y activar con un enlace en sites-enabled. Certificado con: certbot --nginx -d olympoestofaria.com.br
# Reemplaza olympoestofaria.com.br y /var/www/olympo por tu dominio y ruta.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name olympoestofaria.com.br www.olympoestofaria.com.br;
    return 301 https://olympoestofaria.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name olympoestofaria.com.br;

    root /var/www/olympo/current/public;
    index index.php;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/olympoestofaria.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/olympoestofaria.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Subidas: fotos del check-in, documentos y videos de la galería (máx. 200 MB en el panel).
    client_max_body_size 210m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;

    # Assets con hash de Vite y fuentes: caché larga e inmutable.
    location ~* ^/(build|fonts|css/filament|js/filament)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Medios públicos del portal (galería, logos).
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # WebSockets de Laravel Reverb (tiempo real).
    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.svg { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    # Nada de archivos ocultos ni otros .php.
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }

    server_tokens off;
}
